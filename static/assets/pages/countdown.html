<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compte à rebours</title>
</head>
<body>
    <div hidden>
        Très bien tenté April !! C'est une bonne idée de venir voir le code source de la page. Tu penses vraiment que tu vas trouver quelque chose ici ?
        Peut-être qu'attendre est la bonne solution ? Peut-être est-ce possible de se débrouiller si tu n'as vraiment pas envie d'attendre.
    </div>
<div id="countdown"></div>

<script>
const targetDate = new Date("2026-07-07T01:00:00");

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").textContent = atob('aHR0cHM6Ly91c2VsZXNzLWFyY2hpdmVzLmNvbS9hc3NldHMvcGFnZXMvaGFwcHktYmlydGhkYXktYXByaWwuaHRtbA==');
        clearInterval(timer);
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
const timer = setInterval(updateCountdown, 1000);
</script>

</body>
</html>
